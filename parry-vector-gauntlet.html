<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PARRY VECTOR // GAUNTLET</title>
<style>
  :root {
    --bg: #050608;
    --cyan: #00f0ff;
    --crimson: #ff2a55;
    --emerald: #00ff9d;
    --amber: #ffb800;
    --text: #e6f4f8;
    --muted: #6c8594;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #topBar {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: nowrap;
  }
  .hud-btn {
    background: rgba(10, 14, 20, 0.84);
    border: 1px solid rgba(0, 240, 255, 0.35);
    color: var(--cyan);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: all 0.15s ease;
  }
  .hud-btn:hover, .hud-btn:active {
    background: rgba(0, 240, 255, 0.18);
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
  }
  #gamepadBadge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    padding: 5px 9px;
    border-radius: 4px;
    background: rgba(10, 14, 20, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--muted);
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  #gamepadBadge.connected {
    border-color: rgba(0, 255, 157, 0.5);
    color: var(--emerald);
    box-shadow: 0 0 10px rgba(0, 255, 157, 0.2);
  }
  @media (max-width: 600px) {
    #topBar {
      top: max(6px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      gap: 4px;
    }
    .hud-btn {
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 4px 7px;
    }
    #gamepadBadge {
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 4px 6px;
    }
  }
  #touchControls {
    display: none;
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 15;
  }
  #touchControls.active {
    display: block;
  }
  #touchControls.menu-hidden {
    opacity: 0.16;
  }
  #touchControls.menu-hidden * {
    pointer-events: none !important;
  }
  .stick-zone {
    position: absolute;
    bottom: max(22px, env(safe-area-inset-bottom));
    width: 132px;
    height: 132px;
    border-radius: 50%;
    border: 1.5px solid rgba(0, 240, 255, 0.25);
    background: rgba(0, 240, 255, 0.04);
    pointer-events: auto;
  }
  #moveZone { left: max(22px, env(safe-area-inset-left)); }
  #aimZone { right: max(22px, env(safe-area-inset-right)); }
  .stick-knob {
    position: absolute;
    width: 48px;
    height: 48px;
    left: 50%;
    top: 50%;
    margin-left: -24px;
    margin-top: -24px;
    border-radius: 50%;
    background: rgba(0, 240, 255, 0.28);
    border: 1.5px solid var(--cyan);
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
    pointer-events: none;
  }
  #touchParryBtn {
    position: absolute;
    right: max(172px, calc(env(safe-area-inset-right) + 172px));
    bottom: max(36px, calc(env(safe-area-inset-bottom) + 14px));
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: rgba(0, 255, 157, 0.14);
    border: 2px solid var(--emerald);
    color: var(--emerald);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    box-shadow: 0 0 18px rgba(0, 255, 157, 0.25);
  }
  #touchParryBtn:active {
    background: rgba(0, 255, 157, 0.38);
    transform: scale(0.94);
  }
  @media (max-width: 600px) {
    .stick-zone {
      bottom: max(14px, env(safe-area-inset-bottom));
      width: 104px;
      height: 104px;
    }
    #moveZone { left: max(12px, env(safe-area-inset-left)); }
    #aimZone { right: max(12px, env(safe-area-inset-right)); }
    .stick-knob {
      width: 38px;
      height: 38px;
      margin-left: -19px;
      margin-top: -19px;
    }
    #touchParryBtn {
      left: 50%;
      right: auto;
      margin-left: -36px;
      bottom: max(42px, calc(env(safe-area-inset-bottom) + 28px));
      width: 72px;
      height: 72px;
      font-size: 11px;
    }
  }
</style>
</head>
<body>
<div id="topBar">
  <div id="gamepadBadge">INPUT: KEYBOARD / MOUSE</div>
  <button class="hud-btn" id="audioBtn" title="Toggle Synth Audio">AUDIO: ON</button>
  <button class="hud-btn" id="pauseBtn" title="Pause or Resume (Esc / P / Start — Esc again or B for Menu)">PAUSE</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="touchControls">
  <div id="moveZone" class="stick-zone"><div id="moveKnob" class="stick-knob"></div></div>
  <div id="touchParryBtn">PARRY</div>
  <div id="aimZone" class="stick-zone"><div id="aimKnob" class="stick-knob"></div></div>
</div>

<script>
(() => {
  'use strict';

  // ============================================================================
  // 0. PERSISTENCE (UNLOCK + BESTS PER MODE)
  // ============================================================================
  const SAVE_KEY = 'parry_vector_gauntlet_v1';

  function loadSave() {
    const fallback = {
      overclockedUnlocked: false,
      best: {
        STANDARD: { score: 0, time: null },
        OVERCLOCKED: { score: 0, time: null }
      }
    };
    try {
      const raw = window.localStorage.getItem(SAVE_KEY);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return fallback;
      const b = parsed.best || {};
      return {
        overclockedUnlocked: Boolean(parsed.overclockedUnlocked),
        best: {
          STANDARD: {
            score: Number.isFinite(b.STANDARD && b.STANDARD.score) ? b.STANDARD.score : 0,
            time: (b.STANDARD && Number.isFinite(b.STANDARD.time) && b.STANDARD.time > 0) ? b.STANDARD.time : null
          },
          OVERCLOCKED: {
            score: Number.isFinite(b.OVERCLOCKED && b.OVERCLOCKED.score) ? b.OVERCLOCKED.score : 0,
            time: (b.OVERCLOCKED && Number.isFinite(b.OVERCLOCKED.time) && b.OVERCLOCKED.time > 0) ? b.OVERCLOCKED.time : null
          }
        }
      };
    } catch (_) {
      return fallback;
    }
  }

  function writeSave() {
    try {
      window.localStorage.setItem(SAVE_KEY, JSON.stringify({
        overclockedUnlocked: state.overclockedUnlocked,
        best: state.best
      }));
    } catch (_) {}
  }

  // ============================================================================
  // 1. CANVAS & RESPONSIVE ARENA SCALING
  // ============================================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  const arena = {
    x: 0, y: 0, w: 960, h: 640, cx: 480, cy: 320, pad: 24
  };

  function isNarrow() {
    return W < 640;
  }

  function updateInputBadge() {
    const badge = document.getElementById('gamepadBadge');
    const audioBtn = document.getElementById('audioBtn');
    const narrow = isNarrow();
    if (padState.connected) {
      badge.textContent = narrow ? 'XBOX PAD' : 'XBOX CONTROLLER // HAPTICS READY';
      badge.classList.add('connected');
    } else if (touchState.active) {
      badge.textContent = narrow ? 'TOUCH' : 'INPUT: TOUCH TWIN-STICK';
      badge.classList.remove('connected');
    } else {
      badge.textContent = narrow ? 'KBM' : 'INPUT: KEYBOARD / MOUSE';
      badge.classList.remove('connected');
    }
    audioBtn.textContent = narrow
      ? (audio.enabled ? 'SFX: ON' : 'SFX: OFF')
      : (audio.enabled ? 'AUDIO: ON' : 'AUDIO: OFF');
  }

  function updateTouchVisibility() {
    const tc = document.getElementById('touchControls');
    if (touchState.active && !padState.connected) {
      tc.classList.add('active');
      if (state.screen === 'PLAYING') tc.classList.remove('menu-hidden');
      else tc.classList.add('menu-hidden');
    } else {
      tc.classList.remove('active');
      tc.classList.remove('menu-hidden');
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const narrow = isNarrow();
    const topMargin = narrow ? 72 : 76;
    const bottomMargin = touchState.active ? (W <= 600 ? 140 : 168) : (narrow ? 18 : 26);
    const sideMargin = narrow ? 14 : 28;
    const availW = Math.max(280, W - sideMargin * 2);
    const availH = Math.max(240, H - topMargin - bottomMargin);

    arena.w = Math.min(1120, availW);
    arena.h = Math.min(720, availH);
    arena.x = (W - arena.w) * 0.5;
    arena.y = topMargin + (availH - arena.h) * 0.5;
    arena.cx = arena.x + arena.w * 0.5;
    arena.cy = arena.y + arena.h * 0.5;
    initGrid();
    updateInputBadge();
  }

  // ============================================================================
  // 2. REACTIVE SPRING-LATTICE VECTOR GRID
  // ============================================================================
  let gridCols = 24;
  let gridRows = 16;
  let gridPoints = [];

  function initGrid() {
    gridCols = Math.max(10, Math.round(arena.w / 44));
    gridRows = Math.max(8, Math.round(arena.h / 44));
    gridPoints = [];
    for (let r = 0; r <= gridRows; r++) {
      const row = [];
      for (let c = 0; c <= gridCols; c++) {
        const bx = arena.x + (arena.w * c) / gridCols;
        const by = arena.y + (arena.h * r) / gridRows;
        row.push({ bx, by, x: bx, y: by, vx: 0, vy: 0 });
      }
      gridPoints.push(row);
    }
  }

  function impulseGrid(ix, iy, radius, strength) {
    const r2 = radius * radius;
    for (let r = 1; r < gridRows; r++) {
      for (let c = 1; c < gridCols; c++) {
        const p = gridPoints[r][c];
        const dx = p.x - ix;
        const dy = p.y - iy;
        const d2 = dx * dx + dy * dy;
        if (d2 < r2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const falloff = (1 - d / radius);
          const f = falloff * falloff * strength;
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
        }
      }
    }
  }

  function updateGrid(dt) {
    const stiffness = 135;
    const damping = 0.86;
    for (let r = 1; r < gridRows; r++) {
      for (let c = 1; c < gridCols; c++) {
        const p = gridPoints[r][c];
        const ax = (p.bx - p.x) * stiffness;
        const ay = (p.by - p.y) * stiffness;
        p.vx = (p.vx + ax * dt) * damping;
        p.vy = (p.vy + ay * dt) * damping;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
  }

  function drawGrid(overdriveRatio) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(arena.x, arena.y, arena.w, arena.h);
    ctx.clip();

    const baseAlpha = 0.075 + overdriveRatio * 0.075;
    ctx.strokeStyle = overdriveRatio > 0.05
      ? `rgba(0, 255, 157, ${baseAlpha.toFixed(3)})`
      : `rgba(0, 240, 255, ${baseAlpha.toFixed(3)})`;
    ctx.lineWidth = 1;

    for (let r = 0; r <= gridRows; r++) {
      ctx.beginPath();
      for (let c = 0; c <= gridCols; c++) {
        const p = gridPoints[r][c];
        if (c === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    for (let c = 0; c <= gridCols; c++) {
      ctx.beginPath();
      for (let r = 0; r <= gridRows; r++) {
        const p = gridPoints[r][c];
        if (r === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ============================================================================
  // 3. PROCEDURAL WEB AUDIO API DARK-SYNTH & SFX ENGINE
  // ============================================================================
  const audio = {
    ctx: null,
    enabled: true,
    master: null,
    musicFilter: null,
    stepTimer: 0,
    stepIndex: 0,
    bpm: 128,

    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return;
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? 0.28 : 0.0;
      this.master.connect(this.ctx.destination);

      this.musicFilter = this.ctx.createBiquadFilter();
      this.musicFilter.type = 'lowpass';
      this.musicFilter.frequency.value = 720;
      this.musicFilter.Q.value = 3.2;
      this.musicFilter.connect(this.master);
    },

    toggle() {
      this.enabled = !this.enabled;
      if (this.master && this.ctx) {
        this.master.gain.setTargetAtTime(this.enabled ? 0.28 : 0.0, this.ctx.currentTime, 0.03);
      }
      updateInputBadge();
    },

    updateMusic(dt, playing, overdrive, bossIdx) {
      if (!this.ctx || !this.enabled || !playing) return;
      if (this.ctx.state === 'suspended') return;

      const targetCutoff = overdrive > 0 ? 3600 : (680 + bossIdx * 220);
      this.musicFilter.frequency.setTargetAtTime(targetCutoff, this.ctx.currentTime, 0.08);

      const stepDur = 60 / this.bpm / 4; // 16th notes
      this.stepTimer += dt;
      while (this.stepTimer >= stepDur) {
        this.stepTimer -= stepDur;
        this.triggerSeqStep(this.stepIndex, overdrive > 0, bossIdx);
        this.stepIndex = (this.stepIndex + 1) % 16;
      }
    },

    triggerSeqStep(step, isOverdrive, bossIdx) {
      const now = this.ctx.currentTime;
      const roots = [55.0, 49.0, 43.65]; // A1, G1, F1
      const root = roots[bossIdx % roots.length];
      const bassNotes = [1, 1, 2, 1, 1, 1.5, 1, 1.333, 1, 1, 2, 1, 1.5, 1.333, 1.189, 1];
      const freq = root * bassNotes[step];

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = isOverdrive ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(step % 4 === 0 ? 0.24 : 0.14, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

      osc.connect(gain);
      gain.connect(this.musicFilter);
      osc.start(now);
      osc.stop(now + 0.12);

      if (step % 4 === 0) {
        const kOsc = this.ctx.createOscillator();
        const kGain = this.ctx.createGain();
        kOsc.type = 'sine';
        kOsc.frequency.setValueAtTime(125, now);
        kOsc.frequency.exponentialRampToValueAtTime(34, now + 0.09);
        kGain.gain.setValueAtTime(0.32, now);
        kGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        kOsc.connect(kGain);
        kGain.connect(this.master);
        kOsc.start(now);
        kOsc.stop(now + 0.11);
      }

      if (isOverdrive && step % 2 === 1) {
        const aOsc = this.ctx.createOscillator();
        const aGain = this.ctx.createGain();
        const intervals = [4, 6, 7.12, 8, 9.5, 8, 6, 4];
        aOsc.type = 'sine';
        aOsc.frequency.setValueAtTime(root * intervals[(step >> 1) % intervals.length], now);
        aGain.gain.setValueAtTime(0.07, now);
        aGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        aOsc.connect(aGain);
        aGain.connect(this.master);
        aOsc.start(now);
        aOsc.stop(now + 0.1);
      }
    },

    sfxShoot(heatRatio, overdrive) {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = overdrive ? 'sawtooth' : 'square';
      const baseF = overdrive ? 760 : (420 + heatRatio * 340);
      osc.frequency.setValueAtTime(baseF, now);
      osc.frequency.exponentialRampToValueAtTime(130, now + 0.055);
      gain.gain.setValueAtTime(overdrive ? 0.11 : 0.075, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.065);
    },

    sfxParryCast() {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.095);
    },

    sfxParrySuccess(count) {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const freqs = [587.33, 880.0, 1174.66 + Math.min(count, 8) * 45];
      freqs.forEach((f, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(f, now + idx * 0.018);
        osc.frequency.exponentialRampToValueAtTime(f * 1.18, now + idx * 0.018 + 0.22);
        gain.gain.setValueAtTime(0.22, now + idx * 0.018);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.018 + 0.24);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(now + idx * 0.018);
        osc.stop(now + idx * 0.018 + 0.25);
      });
    },

    sfxReflectHit() {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(48, now + 0.11);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.125);
    },

    sfxOverheat() {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      [0, 0.09].forEach((offset) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(210, now + offset);
        osc.frequency.linearRampToValueAtTime(140, now + offset + 0.07);
        gain.gain.setValueAtTime(0.2, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.075);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(now + offset);
        osc.stop(now + offset + 0.08);
      });
    },

    sfxPlayerHit() {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(32, now + 0.34);
      gain.gain.setValueAtTime(0.38, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.37);
    },

    sfxBossExplosion() {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      for (let i = 0; i < 4; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = i % 2 === 0 ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(140 - i * 22, now + i * 0.06);
        osc.frequency.exponentialRampToValueAtTime(24, now + i * 0.06 + 0.45);
        gain.gain.setValueAtTime(0.32, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.48);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(now + i * 0.06);
        osc.stop(now + i * 0.06 + 0.5);
      }
    }
  };

  // ============================================================================
  // 4. XBOX WIRELESS CONTROLLER & MULTI-PLATFORM HAPTICS ENGINE
  // ============================================================================
  const haptics = {
    rumble(durationMs, weak, strong, leftTrig = 0, rightTrig = 0) {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (!gp || !gp.connected) continue;
        const act = gp.vibrationActuator;
        if (!act || !act.playEffect) continue;
        const effects = act.effects || [];
        try {
          if (effects.includes('trigger-rumble')) {
            act.playEffect('trigger-rumble', {
              startDelay: 0,
              duration: durationMs,
              weakMagnitude: Math.min(1, Math.max(0, weak)),
              strongMagnitude: Math.min(1, Math.max(0, strong)),
              leftTrigger: Math.min(1, Math.max(0, leftTrig)),
              rightTrigger: Math.min(1, Math.max(0, rightTrig))
            }).catch(() => {});
          } else {
            act.playEffect('dual-rumble', {
              startDelay: 0,
              duration: durationMs,
              weakMagnitude: Math.min(1, Math.max(0, weak)),
              strongMagnitude: Math.min(1, Math.max(0, strong))
            }).catch(() => {});
          }
        } catch (_) {}
      }
    }
  };

  // ============================================================================
  // 5. INPUT MANAGER (XBOX CONTROLLER + KEYBOARD/MOUSE + IPADOS/IOS TOUCH)
  // ============================================================================
  const keys = {};
  const mouse = { x: 0, y: 0, down: false, active: false };
  let lastTouchTime = -10000;
  const touchState = {
    active: false,
    moveId: null, moveVec: { x: 0, y: 0 },
    aimId: null, aimVec: { x: 0, y: 0 }, aimActive: false,
    parryQueued: false
  };

  const padState = {
    connected: false,
    name: '',
    prevA: false,
    prevB: false,
    prevParry: false,
    prevStart: false,
    prevUp: false,
    prevDown: false,
    prevLeft: false,
    prevRight: false
  };

  const moveZone = document.getElementById('moveZone');
  const moveKnob = document.getElementById('moveKnob');
  const aimZone = document.getElementById('aimZone');
  const aimKnob = document.getElementById('aimKnob');
  const touchParryBtn = document.getElementById('touchParryBtn');

  function resetMoveStick() {
    touchState.moveId = null;
    touchState.moveVec.x = 0;
    touchState.moveVec.y = 0;
    moveKnob.style.transform = 'translate(0px, 0px)';
  }

  function resetAimStick() {
    touchState.aimId = null;
    touchState.aimActive = false;
    touchState.aimVec.x = 0;
    touchState.aimVec.y = 0;
    aimKnob.style.transform = 'translate(0px, 0px)';
  }

  function clearAllInputs() {
    for (const k of Object.keys(keys)) keys[k] = false;
    mouse.down = false;
    resetMoveStick();
    resetAimStick();
    touchState.parryQueued = false;
    padState.prevA = false;
    padState.prevB = false;
    padState.prevParry = false;
    padState.prevStart = false;
    padState.prevUp = false;
    padState.prevDown = false;
    padState.prevLeft = false;
    padState.prevRight = false;
  }

  window.addEventListener('blur', clearAllInputs);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearAllInputs();
  });

  window.addEventListener('gamepadconnected', (e) => {
    padState.connected = true;
    padState.name = e.gamepad.id || 'XBOX CONTROLLER';
    touchState.active = false;
    resetMoveStick();
    resetAimStick();
    updateTouchVisibility();
    updateInputBadge();
    haptics.rumble(90, 0.5, 0.3, 0.6, 0.6);
  });

  window.addEventListener('gamepaddisconnected', () => {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const stillConnected = Array.from(pads).some(p => p && p.connected);
    if (!stillConnected) {
      padState.connected = false;
      clearAllInputs();
      updateInputBadge();
    }
  });

  window.addEventListener('keydown', (e) => {
    audio.init();
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) {
      e.preventDefault();
    }

    if (state.screen === 'PLAYING') {
      if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        queueParryOrConfirm();
      } else if (e.code === 'Escape' || e.code === 'KeyP') {
        togglePause();
      }
      return;
    }

    // Menu / Overlay keyboard navigation
    if (state.screen === 'TITLE') {
      if (e.code === 'Tab' || e.code === 'KeyM' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
        toggleDifficulty();
      } else if (e.code === 'Space' || e.code === 'Enter') {
        handleConfirmAction();
      }
    } else if (state.screen === 'PAUSED' || state.screen === 'GAME_OVER' || state.screen === 'VICTORY') {
      if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyW' || e.code === 'KeyS' || e.code === 'Tab') {
        cycleOverlaySelection(1);
      } else if (e.code === 'Space' || e.code === 'Enter') {
        handleConfirmAction();
      } else if (e.code === 'KeyB' || e.code === 'Backspace' || e.code === 'Escape') {
        returnToMenu();
      } else if (state.screen === 'PAUSED' && e.code === 'KeyP') {
        togglePause();
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  canvas.addEventListener('mousemove', (e) => {
    if (performance.now() - lastTouchTime < 600) return;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    if (state.screen === 'PAUSED' || state.screen === 'GAME_OVER' || state.screen === 'VICTORY') {
      const idx = hitTestOverlayButtons(e.clientX, e.clientY);
      if (idx !== -1) state.overlayIdx = idx;
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    if (performance.now() - lastTouchTime < 600) return;
    audio.init();
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    if (e.button === 0) {
      if (state.screen === 'PLAYING') {
        mouse.down = true;
      } else {
        handleCanvasClick(e.clientX, e.clientY);
      }
    } else if (e.button === 2) {
      if (state.screen === 'PLAYING') queueParryOrConfirm();
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) mouse.down = false;
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  function enableTouchUI() {
    if (!touchState.active && !padState.connected) {
      touchState.active = true;
      resize();
      updateTouchVisibility();
      updateInputBadge();
    }
  }

  window.addEventListener('touchstart', (e) => {
    lastTouchTime = performance.now();
    audio.init();
    const prevScreen = state.screen;
    const t0 = e.changedTouches[0];
    const hitPill = (prevScreen === 'TITLE' && e.target === canvas && t0)
      ? hitTestRect(t0.clientX, t0.clientY, getTitlePillRect())
      : false;
    enableTouchUI();
    if (prevScreen !== 'PLAYING' && e.target === canvas && t0) {
      if (hitPill) toggleDifficulty();
      else handleCanvasClick(t0.clientX, t0.clientY);
    }
  }, { passive: true });

  function updateStickTouch(zone, knob, touch, outVec) {
    const rect = zone.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    const maxR = rect.width * 0.36;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    outVec.x = dx / maxR;
    outVec.y = dy / maxR;
  }

  moveZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    touchState.moveId = t.identifier;
    updateStickTouch(moveZone, moveKnob, t, touchState.moveVec);
  }, { passive: false });

  moveZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === touchState.moveId) {
        updateStickTouch(moveZone, moveKnob, t, touchState.moveVec);
      }
    }
  }, { passive: false });

  function onMoveEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === touchState.moveId) resetMoveStick();
    }
  }
  moveZone.addEventListener('touchend', onMoveEnd);
  moveZone.addEventListener('touchcancel', onMoveEnd);

  aimZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    touchState.aimId = t.identifier;
    touchState.aimActive = true;
    updateStickTouch(aimZone, aimKnob, t, touchState.aimVec);
  }, { passive: false });

  aimZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === touchState.aimId) {
        updateStickTouch(aimZone, aimKnob, t, touchState.aimVec);
      }
    }
  }, { passive: false });

  function onAimEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === touchState.aimId) resetAimStick();
    }
  }
  aimZone.addEventListener('touchend', onAimEnd);
  aimZone.addEventListener('touchcancel', onAimEnd);

  window.addEventListener('touchcancel', () => {
    resetMoveStick();
    resetAimStick();
  });

  touchParryBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    audio.init();
    if (state.screen === 'PLAYING') queueParryOrConfirm();
  }, { passive: false });

  // ============================================================================
  // 6. GAME STATE, PLAYER, BOSSES, PROJECTILES & TELEGRAPHS
  // ============================================================================
  const initialSave = loadSave();
  const state = {
    screen: 'TITLE', // TITLE | PLAYING | PAUSED | GAME_OVER | VICTORY
    difficulty: 'STANDARD', // STANDARD | OVERCLOCKED
    overclockedUnlocked: initialSave.overclockedUnlocked,
    best: initialSave.best,
    bossIndex: 0,
    score: 0,
    runTime: 0,
    hitStop: 0,
    shakeTime: 0,
    shakeMag: 0,
    bannerTimer: 0,
    bannerText: '',
    bannerSub: '',
    parryBufferTimer: 0,
    overlayIdx: 0,
    laserHintShown: false,
    laserHintTimer: 0,
    lockHintTimer: 0,
    victoryMsg: '',
    newBestNote: ''
  };

  const player = {
    x: 480, y: 500,
    vx: 0, vy: 0,
    aimAngle: -Math.PI / 2,
    speed: 330,
    hitboxR: 3.5,
    shield: 3,
    maxShield: 3,
    invuln: 0,
    heat: 0,
    overheated: false,
    overheatTimer: 0,
    overdriveTimer: 0,

  let bullets = [];
  let lasers = [];
  let particles = [];
  let floatingTexts = [];
  let boss = null;

  const BOSS_DEFS = [
    {
      name: '01 // ROTATIONAL LATTICE',
      subtitle: 'GEOMETRIC ROTOR & RADIAL SALVO ENGINE',
      hp: 1650,
      radius: 36,

    },
